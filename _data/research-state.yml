# MACHINE-MAINTAINED FILE.
# This file is a rebuildable cache of publicly verified research state.
# External public sources are authoritative; this file and the rendered homepage are not.

schema_version: 2

state_semantics:
  kind: derived_public_cache
  rebuildable_from_external_sources: true
  homepage_is_source_of_truth: false
  current_file_is_evidence: false
  public_only: true
  write_policy: high_confidence_only
  idempotent: true

identity:
  canonical_name: "Chunran Zhang"
  anchors:
    orcid: "0009-0005-8865-2090"
    github_login: "ln-one"
    affiliation: "Southwest Jiaotong University"

source_policy:
  discovery:
    - github
    - arxiv
    - openalex
    - semantic_scholar
    - orcid
    - crossref
    - datacite
    - official_venue_pages
  authority_by_fact:
    arxiv_metadata_and_versions:
      - arxiv
    repository_identity_and_visibility:
      - github
    doi_metadata:
      - crossref
      - datacite
    formal_publication_status:
      - official_venue_pages
      - publisher_or_proceedings
      - crossref
      - datacite
    author_identity:
      - exact_orcid
      - exact_public_institutional_email
      - owned_github_repository_with_explicit_work_link
      - confirmed_scholarly_author_entity
  discovery_only_not_authoritative_for_version_truth:
    - openalex
    - semantic_scholar
    - general_web_search

identity_resolution:
  principles:
    - "Author order must never determine identity."
    - "An exact name match alone is insufficient."
    - "Absence from ORCID is not evidence that a work is unrelated."
    - "Private repositories and non-public manuscripts must never be projected to the public homepage."
  automatic_accept_examples:
    - exact_orcid_match
    - exact_public_institutional_email_match
    - owned_public_repository_explicitly_linked_to_the_work
    - confirmed_author_entity_plus_consistent_independent_evidence
  unresolved_policy: do_not_publish

lineage_resolution:
  principles:
    - "One research work has one canonical work record."
    - "arXiv v1/v2/v3 are versions of one work, not separate works."
    - "A repository, arXiv record, DOI, proceedings entry, and venue publication may be manifestations of the same work."
    - "A later formal publication upgrades the same lineage instead of creating a duplicate work."
  match_signals:
    - persistent_identifier
    - explicit_cross_link
    - exact_or_near_exact_title_with_matching_authorship
    - repository_metadata

