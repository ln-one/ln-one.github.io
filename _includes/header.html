<nav class="navbar sticky-top navbar-expand-md">
  <div class="container" style="max-width: var(--container-max);">
    <a class="navbar-brand" href="{{ '/' | relative_url }}" aria-label="Home">
      <img src="{{ '/images/logo.svg' | relative_url }}" width="36" height="36" alt="">
    </a>
    <button class="navbar-toggler" type="button" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        </li>
        {% for nav in site.nav_pages %}
        <li class="nav-item">
          <a class="nav-link{% if page.url contains nav.name %} active{% endif %}" href="{{ nav.name | prepend: '/' | relative_url }}">{% if nav.label %}{{ nav.label }}{% else %}{{ nav.name | capitalize }}{% endif %}</a>
        </li>
        {% endfor %}
      </ul>
      <div class="d-flex align-items-center" style="gap: var(--space-2);">
        <button class="search-toggle" id="searchToggle" aria-label="Search site" aria-haspopup="dialog" aria-controls="searchOverlay">
          {% include icon.html name="search" %}
        </button>
        {% unless site.dark_mode == false %}
        <button type="button" class="dark-mode-toggle" id="darkModeToggle" aria-label="Theme: Auto (system). Switch to Light">
          {% include icon.html name="sun" id="themeIcon" %}
          <span id="themeLabel">Auto</span>
        </button>
        {% endunless %}
      </div>
    </div>
  </div>
</nav>

<!-- Native modal keeps background content out of keyboard navigation. -->
<dialog class="search-overlay" id="searchOverlay" aria-labelledby="search-title">
<div class="search-modal">
<h2 id="search-title" class="visually-hidden">Search site</h2>
<div class="search-input-wrapper">
{% include icon.html name="search" class="search-input-icon" %}
<label for="searchInput" class="visually-hidden">Search pages</label>
<input type="search" class="search-input" id="searchInput" placeholder="Search pages..." autocomplete="off" autofocus>
<button type="button" class="search-close" id="searchClose" aria-label="Close search">Close <kbd class="search-kbd">Esc</kbd></button>
</div>
<p id="searchStatus" class="visually-hidden" role="status" aria-live="polite"></p>
<div class="search-results" id="searchResults"></div>
</div>
</dialog>
