---
layout: default
---
<article class="practice-page">
  <nav class="practice-nav" aria-label="Practice sections">
    {% assign sections = 'Workflow,Figures,Standards' | split: ',' %}
    {% for section in sections %}
      {% assign section_url = section | downcase | prepend: '/practice/' | append: '/' %}
      <a href="{{ section_url | relative_url }}"{% if page.title == section %} aria-current="page"{% endif %}>{{ section }}</a>
    {% endfor %}
  </nav>
  {{ content }}
</article>
